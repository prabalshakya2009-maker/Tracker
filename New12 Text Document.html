<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Winter Arc</title>
<meta name="theme-color" content="#060a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A daily tracker for your Winter Arc.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%84%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23060a14'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle'%3E%E2%9D%84%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a14;
    --bg-elevated:#0c1526;
    --bg-card:#101b30;
    --bg-card-2:#0d1729;
    --border:#1e2c47;
    --border-soft:#162238;
    --frost:#cfe6ff;
    --ice:#6fb8e8;
    --ice-soft:rgba(111,184,232,.16);
    --ember:#ff8a4c;
    --ember-soft:rgba(255,138,76,.16);
    --text:#e9eef7;
    --text-dim:#8093b3;
    --text-faint:#4d5c7a;
    --danger:#f0685f;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .disp{font-family:'Space Grotesk','Inter',sans-serif;}
  button, input, textarea{font-family:inherit;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:5;
    background:rgba(6,10,20,.86);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-soft);
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  }
  .brand-row{display:flex;align-items:center;justify-content:space-between;}
  .brand{font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:7px;}
  .brand .flake{font-size:16px;}
  .day-badge{font-weight:700;font-size:12.5px;color:var(--ice);background:var(--ice-soft);padding:4px 10px;border-radius:20px;}
  .range-sub{font-size:11.5px;color:var(--text-faint);margin-top:5px;}

  /* ---------- layout ---------- */
  main#views{flex:1;padding:18px 18px calc(96px + env(safe-area-inset-bottom));}
  .view{display:none;}
  .view.active{display:block;animation:riseIn .28s ease;}
  @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  h2.view-title{font-size:19px;font-weight:700;margin:0 0 4px;}
  p.view-sub{font-size:12.5px;color:var(--text-dim);margin:0 0 18px;line-height:1.5;}

  /* ---------- ring ---------- */
  .ring-wrap{display:flex;justify-content:center;margin:6px 0 22px;}
  .ring-outer{
    width:158px;height:158px;border-radius:50%;
    background:conic-gradient(var(--ice) calc(var(--pct,0)*3.6deg), var(--bg-card) 0deg);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px var(--border-soft);
  }
  .ring-inner{
    width:126px;height:126px;border-radius:50%;background:var(--bg-elevated);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring-pct{font-size:26px;font-weight:700;}
  .ring-label{font-size:11px;color:var(--text-dim);margin-top:2px;}

  /* ---------- habit rows ---------- */
  .habit-item{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-card);border:1px solid var(--border-soft);
    border-radius:var(--radius-md);padding:13px 14px;margin-bottom:9px;
    cursor:pointer;user-select:none;transition:border-color .15s, background .15s;
  }
  .habit-item.done{border-color:rgba(111,184,232,.45);background:linear-gradient(180deg, rgba(111,184,232,.08), var(--bg-card));}
  .habit-check{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--text-faint);display:flex;align-items:center;justify-content:center;
    font-size:13px;transition:.15s;
  }
  .habit-item.done .habit-check{background:var(--ice);border-color:var(--ice);color:#06121f;}
  .habit-icon{font-size:19px;width:24px;text-align:center;flex-shrink:0;}
  .habit-name{flex:1;font-size:14.5px;font-weight:500;}
  .habit-item.done .habit-name{color:var(--frost);}

  .empty-state{
    text-align:center;padding:38px 18px;color:var(--text-dim);
    border:1px dashed var(--border);border-radius:var(--radius-md);font-size:13px;line-height:1.6;
  }

  /* ---------- note box ---------- */
  .note-box{margin-top:18px;}
  .note-box label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:7px;}
  textarea{
    width:100%;background:var(--bg-card);border:1px solid var(--border-soft);
    border-radius:var(--radius-md);color:var(--text);padding:12px 13px;font-size:13.5px;
    resize:vertical;min-height:64px;line-height:1.5;
  }
  textarea:focus, input:focus{outline:2px solid var(--ice);outline-offset:1px;}

  /* ---------- gated states (before start / after end) ---------- */
  .gate-card{
    text-align:center;background:var(--bg-card);border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);padding:34px 22px;margin-top:10px;
  }
  .gate-emoji{font-size:34px;margin-bottom:10px;}
  .gate-title{font-size:17px;font-weight:700;margin-bottom:6px;}
  .gate-sub{font-size:13px;color:var(--text-dim);line-height:1.6;}
  .gate-count{font-family:'Space Grotesk';font-size:38px;font-weight:700;color:var(--ember);margin:14px 0 4px;}

  /* ---------- calendar ---------- */
  .month-block{margin-bottom:24px;}
  .month-title{font-size:13.5px;font-weight:700;color:var(--frost);margin-bottom:9px;}
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
  .weekday-row span{font-size:9.5px;color:var(--text-faint);text-align:center;}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .day-cell{
    aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;color:var(--text-dim);border:1px solid var(--border-soft);cursor:pointer;
  }
  .day-cell.empty{visibility:hidden;cursor:default;}
  .day-cell.future{opacity:.32;border-style:dashed;cursor:default;}
  .day-cell.today{box-shadow:0 0 0 2px var(--ember);}
  .legend{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10.5px;color:var(--text-faint);}
  .legend-swatch{width:10px;height:10px;border-radius:3px;background:var(--ice);}

  /* ---------- stats ---------- */
  .stat-hero{display:flex;gap:10px;margin-bottom:22px;}
  .stat-box{flex:1;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:16px 8px;text-align:center;}
  .stat-num{font-size:26px;font-weight:700;color:var(--ember);}
  .stat-num.ice{color:var(--ice);}
  .stat-label{font-size:10.5px;color:var(--text-dim);margin-top:3px;}
  .section-label{font-size:12.5px;font-weight:700;color:var(--text-dim);margin:22px 0 12px;}
  .habit-stat-row{margin-bottom:13px;}
  .habit-stat-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .habit-stat-top span:last-child{color:var(--text-dim);}
  .bar-track{height:7px;background:var(--bg-card);border-radius:5px;overflow:hidden;border:1px solid var(--border-soft);}
  .bar-fill{height:100%;background:var(--ice);border-radius:5px;}

  /* ---------- manage ---------- */
  .manage-habit{
    display:flex;align-items:center;gap:11px;background:var(--bg-card);
    border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:11px 12px;margin-bottom:8px;
  }
  .manage-habit .habit-icon{font-size:18px;}
  .manage-habit .habit-name{flex:1;font-size:13.5px;}
  .icon-btn{background:none;border:none;color:var(--text-dim);font-size:16px;padding:6px;cursor:pointer;border-radius:8px;}
  .icon-btn:active{background:var(--border-soft);}
  .add-habit-btn{
    width:100%;padding:13px;border-radius:var(--radius-md);border:1px dashed var(--text-faint);
    background:none;color:var(--text-dim);font-size:13.5px;font-weight:600;cursor:pointer;margin-top:6px;
  }
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:7px;}
  .field input[type=text], .field input[type=date]{
    width:100%;background:var(--bg-card);border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);color:var(--text);padding:11px 12px;font-size:14px;
  }
  .date-row{display:flex;gap:10px;}
  .date-row .field{flex:1;}
  .btn{
    display:block;width:100%;text-align:center;padding:13px;border-radius:var(--radius-md);
    font-size:14px;font-weight:700;border:1px solid transparent;cursor:pointer;margin-bottom:10px;
  }
  .btn-primary{background:var(--ice);color:#06121f;}
  .btn-ghost{background:none;border-color:var(--border);color:var(--text);}
  .btn-danger{background:none;border-color:rgba(240,104,95,.4);color:var(--danger);}
  .row-2{display:flex;gap:10px;}
  .row-2 .btn{flex:1;}
  .emoji-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:16px;}
  .emoji-opt{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;
    background:var(--bg-card);border:1px solid var(--border-soft);border-radius:10px;cursor:pointer;
  }
  .emoji-opt.picked{border-color:var(--ice);background:var(--ice-soft);}

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:10;
    max-width:480px;margin:0 auto;display:flex;
    background:rgba(9,14,26,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--border-soft);
    padding:9px 6px calc(9px + env(safe-area-inset-bottom));
  }
  .bottomnav button{
    flex:1;background:none;border:none;color:var(--text-faint);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;padding:5px 0;border-radius:12px;cursor:pointer;font-weight:600;
  }
  .bottomnav button .icon{font-size:19px;}
  .bottomnav button.active{color:var(--ice);}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(3,6,12,.66);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;z-index:20;
  }
  .overlay.hidden{display:none;}
  .modal{
    width:100%;max-width:480px;background:var(--bg-elevated);
    border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:86vh;overflow-y:auto;border-top:1px solid var(--border);
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .modal-title{font-size:16.5px;font-weight:700;margin:0 0 4px;}
  .modal-sub{font-size:12px;color:var(--text-dim);margin:0 0 18px;}
  .modal-close-row{display:flex;justify-content:flex-end;margin-bottom:-6px;}
  .modal-close-row button{background:none;border:none;color:var(--text-faint);font-size:20px;cursor:pointer;padding:4px 8px;}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand-row">
      <div class="brand"><span class="flake">❄️</span><span class="disp">WINTER ARC</span></div>
      <div class="day-badge disp" id="dayBadge">Day –</div>
    </div>
    <div class="range-sub" id="rangeSub"></div>
  </header>

  <main id="views">

    <!-- TODAY -->
    <section class="view active" id="view-today">
      <div id="todayGated"></div>
      <div id="todayNormal" style="display:none;">
        <div class="ring-wrap">
          <div class="ring-outer" id="ringOuter" style="--pct:0;">
            <div class="ring-inner">
              <div class="ring-pct disp" id="ringPct">0%</div>
              <div class="ring-label" id="ringLabel">Today</div>
            </div>
          </div>
        </div>
        <div id="todayHabitList"></div>
        <div class="note-box">
          <label for="todayNote">Notes for today</label>
          <textarea id="todayNote" placeholder="How did today go?"></textarea>
        </div>
      </div>
    </section>

    <!-- CALENDAR -->
    <section class="view" id="view-calendar">
      <h2 class="view-title">Calendar</h2>
      <p class="view-sub">Tap any day to view or edit it.</p>
      <div class="legend"><span class="legend-swatch"></span> darker = more habits completed that day</div>
      <div id="calendarWrap" style="margin-top:16px;"></div>
    </section>

    <!-- STATS -->
    <section class="view" id="view-stats">
      <h2 class="view-title">Stats</h2>
      <p class="view-sub">Your progress across the whole arc.</p>
      <div class="stat-hero">
        <div class="stat-box"><div class="stat-num disp" id="statStreak">0</div><div class="stat-label">current streak</div></div>
        <div class="stat-box"><div class="stat-num disp ice" id="statBest">0</div><div class="stat-label">best streak</div></div>
        <div class="stat-box"><div class="stat-num disp ice" id="statPct">0%</div><div class="stat-label">arc completion</div></div>
      </div>
      <div class="section-label">By habit</div>
      <div id="habitStatsWrap"></div>
    </section>

    <!-- MANAGE -->
    <section class="view" id="view-manage">
      <h2 class="view-title">Manage</h2>
      <p class="view-sub">Edit your habits and arc settings.</p>

      <div class="section-label" style="margin-top:0;">Habits</div>
      <div id="manageHabitList"></div>
      <button class="add-habit-btn" id="addHabitBtn">+ Add a habit</button>

      <div class="section-label">Arc dates</div>
      <div class="date-row">
        <div class="field"><label>Start date</label><input type="date" id="startDateInput"></div>
        <div class="field"><label>End date</label><input type="date" id="endDateInput"></div>
      </div>
      <button class="btn btn-primary" id="saveDatesBtn">Save dates</button>

      <div class="section-label">Your data</div>
      <button class="btn btn-ghost" id="exportBtn">Export backup (.json)</button>
      <button class="btn btn-ghost" id="importBtn">Import backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn btn-danger" id="resetBtn">Reset all data</button>
    </section>

  </main>

  <nav class="bottomnav">
    <button data-view="today" class="active"><span class="icon">🔥</span><span>Today</span></button>
    <button data-view="calendar"><span class="icon">📅</span><span>Calendar</span></button>
    <button data-view="stats"><span class="icon">📊</span><span>Stats</span></button>
    <button data-view="manage"><span class="icon">⚙️</span><span>Manage</span></button>
  </nav>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "winterArcData_v1";
  var EMOJI_PRESET = ["💪","🏃","📚","💧","🧘","😴","🥗","🚭","📵","🙏","✍️","❄️","🔥","⏰","🚿","🧠","💊","🎯"];
  var WEEKDAYS = ["S","M","T","W","T","F","S"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function toDateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseDateStr(s){
    var parts = s.split("-").map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function addDays(dateStr, n){
    var d = parseDateStr(dateStr);
    d.setDate(d.getDate()+n);
    return toDateStr(d);
  }
  function daysBetween(a,b){ return Math.round((parseDateStr(b)-parseDateStr(a))/86400000); }
  function todayStr(){ return toDateStr(new Date()); }
  function fmtLong(dateStr){
    var d = parseDateStr(dateStr);
    return d.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric", year:"numeric"});
  }
  function fmtShort(dateStr){
    var d = parseDateStr(dateStr);
    return d.toLocaleDateString(undefined,{month:"short", day:"numeric", year:"numeric"});
  }
  function uid(){ return "h" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function defaultHabits(startDate){
    var defs = [
      ["🌅","Wake up early"],
      ["💪","Workout"],
      ["🚿","Cold shower"],
      ["📚","Read / study"],
      ["💧","Drink 3L water"],
      ["🥗","No junk food"],
      ["🧘","Meditate"],
      ["😴","Sleep 7–8 hrs"]
    ];
    return defs.map(function(d){
      return { id: uid(), icon: d[0], name: d[1], createdAt: startDate };
    });
  }

  function defaultState(){
    var start = "2026-09-02";
    var end = "2027-02-28";
    return {
      settings: { startDate: start, endDate: end },
      habits: defaultHabits(start),
      logs: {}
    };
  }

  var state = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed.settings || !parsed.habits || !parsed.logs) return defaultState();
      return parsed;
    }catch(e){
      return defaultState();
    }
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ alert("Could not save — your browser storage may be full or blocked."); }
  }

  function getLog(dateStr, create){
    if(!state.logs[dateStr]){
      if(!create) return { done:{}, note:"" };
      state.logs[dateStr] = { done:{}, note:"" };
    }
    return state.logs[dateStr];
  }

  function activeHabitsFor(dateStr){
    return state.habits.filter(function(h){ return !h.createdAt || h.createdAt <= dateStr; });
  }

  function dayCompletion(dateStr){
    var habits = activeHabitsFor(dateStr);
    if(habits.length === 0) return { done:0, total:0, pct:0, all:false };
    var log = getLog(dateStr, false);
    var done = habits.filter(function(h){ return !!log.done[h.id]; }).length;
    var pct = Math.round((done/habits.length)*100);
    return { done: done, total: habits.length, pct: pct, all: done === habits.length };
  }

  function toggleHabit(dateStr, habitId){
    var log = getLog(dateStr, true);
    log.done[habitId] = !log.done[habitId];
    saveState();
    renderAll();
  }

  function computeStreaks(){
    var s = state.settings;
    var today = todayStr();
    var lastCountable = today < s.endDate ? today : s.endDate;
    if(lastCountable < s.startDate){ return { current:0, best:0 }; }

    // current streak: walk backward from lastCountable (skip today if not yet complete)
    var current = 0;
    var cursor = lastCountable;
    var startCursor = cursor;
    if(cursor === today){
      var tc = dayCompletion(cursor);
      if(!tc.all){ cursor = addDays(cursor, -1); }
    }
    while(cursor >= s.startDate){
      var c = dayCompletion(cursor);
      if(c.total > 0 && c.all){ current++; cursor = addDays(cursor, -1); }
      else break;
    }

    // best streak: scan full range up to lastCountable
    var best = 0, run = 0;
    var d = s.startDate;
    while(d <= lastCountable){
      var dc = dayCompletion(d);
      if(dc.total > 0 && dc.all){ run++; if(run>best) best = run; }
      else { run = 0; }
      d = addDays(d, 1);
    }
    return { current: current, best: best };
  }

  function overallArcPct(){
    var s = state.settings;
    var today = todayStr();
    var lastCountable = today < s.endDate ? today : s.endDate;
    if(lastCountable < s.startDate) return 0;
    var totalDone = 0, totalPossible = 0;
    var d = s.startDate;
    while(d <= lastCountable){
      var habits = activeHabitsFor(d);
      if(habits.length){
        var log = getLog(d, false);
        totalPossible += habits.length;
        totalDone += habits.filter(function(h){ return !!log.done[h.id]; }).length;
      }
      d = addDays(d, 1);
    }
    if(totalPossible === 0) return 0;
    return Math.round((totalDone/totalPossible)*100);
  }

  function habitCompletionPct(habitId){
    var s = state.settings;
    var today = todayStr();
    var lastCountable = today < s.endDate ? today : s.endDate;
    var habit = state.habits.filter(function(h){ return h.id===habitId; })[0];
    if(!habit) return 0;
    var from = habit.createdAt > s.startDate ? habit.createdAt : s.startDate;
    if(lastCountable < from) return 0;
    var total = 0, done = 0;
    var d = from;
    while(d <= lastCountable){
      total++;
      var log = getLog(d, false);
      if(log.done[habitId]) done++;
      d = addDays(d, 1);
    }
    if(total===0) return 0;
    return Math.round((done/total)*100);
  }

  /* ---------------- rendering ---------------- */

  var currentView = "today";

  function switchView(name){
    currentView = name;
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    document.getElementById("view-"+name).classList.add("active");
    document.querySelectorAll(".bottomnav button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-view") === name);
    });
    document.getElementById("views").scrollTop = 0;
  }

  function renderTopbar(){
    var s = state.settings;
    var today = todayStr();
    var badge = document.getElementById("dayBadge");
    var sub = document.getElementById("rangeSub");
    sub.textContent = fmtShort(s.startDate) + " → " + fmtShort(s.endDate);
    if(today < s.startDate){
      badge.textContent = "Not started";
    } else if(today > s.endDate){
      badge.textContent = "Complete";
    } else {
      var dayNum = daysBetween(s.startDate, today) + 1;
      var total = daysBetween(s.startDate, s.endDate) + 1;
      badge.textContent = "Day " + dayNum + " / " + total;
    }
  }

  function renderToday(){
    var s = state.settings;
    var today = todayStr();
    var gated = document.getElementById("todayGated");
    var normal = document.getElementById("todayNormal");

    if(today < s.startDate){
      gated.style.display = "block"; normal.style.display = "none";
      var daysLeft = daysBetween(today, s.startDate);
      gated.innerHTML =
        '<div class="gate-card"><div class="gate-emoji">❄️</div>' +
        '<div class="gate-title disp">Your Winter Arc hasn\'t started yet</div>' +
        '<div class="gate-count disp">' + daysLeft + '</div>' +
        '<div class="gate-sub">day' + (daysLeft===1?'':'s') + ' until it begins on ' + fmtLong(s.startDate) + '. Use the Manage tab to set up your habits now.</div></div>';
      return;
    }
    if(today > s.endDate){
      gated.style.display = "block"; normal.style.display = "none";
      var pct = overallArcPct();
      var st = computeStreaks();
      gated.innerHTML =
        '<div class="gate-card"><div class="gate-emoji">🏔️</div>' +
        '<div class="gate-title disp">Your Winter Arc is complete</div>' +
        '<div class="gate-count disp">' + pct + '%</div>' +
        '<div class="gate-sub">overall completion, with a best streak of ' + st.best + ' day' + (st.best===1?'':'s') + '. Check the Stats tab for the full breakdown.</div></div>';
      return;
    }

    gated.style.display = "none"; normal.style.display = "block";
    var comp = dayCompletion(today);
    document.getElementById("ringOuter").style.setProperty("--pct", comp.pct);
    document.getElementById("ringPct").textContent = comp.pct + "%";
    document.getElementById("ringLabel").textContent = comp.done + " / " + comp.total + " today";

    var habits = activeHabitsFor(today);
    var log = getLog(today, false);
    var list = document.getElementById("todayHabitList");
    if(habits.length === 0){
      list.innerHTML = '<div class="empty-state">No habits yet. Head to Manage to add what you want to track.</div>';
    } else {
      list.innerHTML = habits.map(function(h){
        var done = !!log.done[h.id];
        return '<div class="habit-item ' + (done?'done':'') + '" data-habit="' + h.id + '">' +
          '<div class="habit-check">' + (done?'✓':'') + '</div>' +
          '<div class="habit-icon">' + h.icon + '</div>' +
          '<div class="habit-name">' + escapeHtml(h.name) + '</div></div>';
      }).join("");
      list.querySelectorAll(".habit-item").forEach(function(el){
        el.addEventListener("click", function(){ toggleHabit(today, el.getAttribute("data-habit")); });
      });
    }

    var noteEl = document.getElementById("todayNote");
    noteEl.value = log.note || "";
    noteEl.oninput = function(){
      var l = getLog(today, true);
      l.note = noteEl.value;
      saveState();
    };
  }

  function renderCalendar(){
    var s = state.settings;
    var today = todayStr();
    var wrap = document.getElementById("calendarWrap");
    wrap.innerHTML = "";

    var cursor = parseDateStr(s.startDate);
    var endD = parseDateStr(s.endDate);

    while(cursor <= endD){
      var year = cursor.getFullYear(), month = cursor.getMonth();
      var monthStart = new Date(year, month, 1);
      var monthEnd = new Date(year, month+1, 0);
      var rangeStartInMonth = monthStart < parseDateStr(s.startDate) ? parseDateStr(s.startDate) : monthStart;
      var rangeEndInMonth = monthEnd > endD ? endD : monthEnd;

      var block = document.createElement("div");
      block.className = "month-block";

      var title = document.createElement("div");
      title.className = "month-title disp";
      title.textContent = MONTH_NAMES[month] + " " + year;
      block.appendChild(title);

      var wkRow = document.createElement("div");
      wkRow.className = "weekday-row";
      WEEKDAYS.forEach(function(w){ var sp=document.createElement("span"); sp.textContent=w; wkRow.appendChild(sp); });
      block.appendChild(wkRow);

      var grid = document.createElement("div");
      grid.className = "month-grid";

      var leadEmpty = monthStart.getDay();
      for(var i=0;i<leadEmpty;i++){
        var e = document.createElement("div"); e.className="day-cell empty"; grid.appendChild(e);
      }

      var dcursor = new Date(monthStart);
      while(dcursor <= monthEnd){
        var ds = toDateStr(dcursor);
        var cell = document.createElement("div");
        cell.className = "day-cell";
        cell.textContent = dcursor.getDate();

        if(ds < s.startDate || ds > s.endDate){
          cell.classList.add("empty");
        } else if(ds > today){
          cell.classList.add("future");
        } else {
          var comp = dayCompletion(ds);
          if(comp.total > 0){
            var alpha = 0.12 + (comp.pct/100)*0.72;
            cell.style.background = "rgba(111,184,232," + alpha.toFixed(2) + ")";
            cell.style.borderColor = "transparent";
            cell.style.color = comp.pct > 55 ? "#06121f" : "var(--frost)";
          }
          if(ds === today) cell.classList.add("today");
          cell.addEventListener("click", function(dateForClick){
            return function(){ openDayModal(dateForClick); };
          }(ds));
        }
        grid.appendChild(cell);
        dcursor.setDate(dcursor.getDate()+1);
      }
      block.appendChild(grid);
      wrap.appendChild(block);
      cursor = new Date(year, month+1, 1);
    }
  }

  function renderStats(){
    var st = computeStreaks();
    document.getElementById("statStreak").textContent = st.current;
    document.getElementById("statBest").textContent = st.best;
    document.getElementById("statPct").textContent = overallArcPct() + "%";

    var wrap = document.getElementById("habitStatsWrap");
    if(state.habits.length === 0){
      wrap.innerHTML = '<div class="empty-state">Add habits to see stats for each one.</div>';
      return;
    }
    wrap.innerHTML = state.habits.map(function(h){
      var pct = habitCompletionPct(h.id);
      return '<div class="habit-stat-row">' +
        '<div class="habit-stat-top"><span>' + h.icon + ' ' + escapeHtml(h.name) + '</span><span>' + pct + '%</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div></div>';
    }).join("");
  }

  function renderManage(){
    var list = document.getElementById("manageHabitList");
    if(state.habits.length === 0){
      list.innerHTML = '<div class="empty-state">No habits yet — add your first one below.</div>';
    } else {
      list.innerHTML = state.habits.map(function(h){
        return '<div class="manage-habit" data-habit="' + h.id + '">' +
          '<div class="habit-icon">' + h.icon + '</div>' +
          '<div class="habit-name">' + escapeHtml(h.name) + '</div>' +
          '<button class="icon-btn edit-btn" data-habit="' + h.id + '">✏️</button>' +
          '<button class="icon-btn del-btn" data-habit="' + h.id + '">🗑️</button></div>';
      }).join("");
      list.querySelectorAll(".edit-btn").forEach(function(b){
        b.addEventListener("click", function(){ openHabitModal(b.getAttribute("data-habit")); });
      });
      list.querySelectorAll(".del-btn").forEach(function(b){
        b.addEventListener("click", function(){ deleteHabit(b.getAttribute("data-habit")); });
      });
    }
    document.getElementById("startDateInput").value = state.settings.startDate;
    document.getElementById("endDateInput").value = state.settings.endDate;
  }

  function renderAll(){
    renderTopbar();
    renderToday();
    renderCalendar();
    renderStats();
    renderManage();
  }

  function escapeHtml(str){
    var d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  /* ---------------- modals ---------------- */

  var overlay = document.getElementById("overlay");
  var modalContent = document.getElementById("modalContent");

  function openModal(html){
    modalContent.innerHTML = html;
    overlay.classList.remove("hidden");
  }
  function closeModal(){
    overlay.classList.add("hidden");
    modalContent.innerHTML = "";
  }
  overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });

  function openHabitModal(habitId){
    var habit = habitId ? state.habits.filter(function(h){ return h.id===habitId; })[0] : null;
    var pickedIcon = habit ? habit.icon : EMOJI_PRESET[Math.floor(Math.random()*EMOJI_PRESET.length)];

    var html =
      '<div class="modal-close-row"><button id="mClose">✕</button></div>' +
      '<div class="modal-title">' + (habit ? "Edit habit" : "Add a habit") + '</div>' +
      '<div class="modal-sub">' + (habit ? "Update the name or icon." : "Anything you want to track daily — big or small.") + '</div>' +
      '<div class="field"><label>Name</label><input type="text" id="mName" maxlength="40" placeholder="e.g. Journal, No sugar, Stretch" value="' + (habit ? escapeAttr(habit.name) : "") + '"></div>' +
      '<label style="display:block;font-size:12px;color:var(--text-dim);margin-bottom:8px;">Icon</label>' +
      '<div class="emoji-pick" id="mEmojiPick"></div>' +
      '<button class="btn btn-primary" id="mSave">' + (habit ? "Save changes" : "Add habit") + '</button>' +
      (habit ? '<button class="btn btn-danger" id="mDelete">Delete habit</button>' : '');

    openModal(html);

    var pickWrap = document.getElementById("mEmojiPick");
    EMOJI_PRESET.forEach(function(em){
      var opt = document.createElement("div");
      opt.className = "emoji-opt" + (em===pickedIcon ? " picked" : "");
      opt.textContent = em;
      opt.addEventListener("click", function(){
        pickWrap.querySelectorAll(".emoji-opt").forEach(function(o){ o.classList.remove("picked"); });
        opt.classList.add("picked");
        pickedIcon = em;
      });
      pickWrap.appendChild(opt);
    });

    document.getElementById("mClose").addEventListener("click", closeModal);
    document.getElementById("mSave").addEventListener("click", function(){
      var name = document.getElementById("mName").value.trim();
      if(!name){ alert("Give this habit a name first."); return; }
      if(habit){
        habit.name = name;
        habit.icon = pickedIcon;
      } else {
        state.habits.push({ id: uid(), icon: pickedIcon, name: name, createdAt: todayStr() < state.settings.startDate ? state.settings.startDate : todayStr() });
      }
      saveState();
      renderAll();
      closeModal();
    });
    if(habit){
      document.getElementById("mDelete").addEventListener("click", function(){
        closeModal();
        deleteHabit(habit.id);
      });
    }
  }

  function escapeAttr(str){ return String(str).replace(/"/g,"&quot;"); }

  function deleteHabit(habitId){
    var habit = state.habits.filter(function(h){ return h.id===habitId; })[0];
    if(!habit) return;
    if(!confirm('Delete "' + habit.name + '"? Past logs for it will be kept but hidden.')) return;
    state.habits = state.habits.filter(function(h){ return h.id !== habitId; });
    saveState();
    renderAll();
  }

  function openDayModal(dateStr){
    var s = state.settings;
    var isPast = dateStr <= todayStr();
    var habits = activeHabitsFor(dateStr);
    var log = getLog(dateStr, false);

    var habitsHtml = habits.length ? habits.map(function(h){
      var done = !!log.done[h.id];
      return '<div class="habit-item ' + (done?'done':'') + '" data-habit="' + h.id + '">' +
        '<div class="habit-check">' + (done?'✓':'') + '</div>' +
        '<div class="habit-icon">' + h.icon + '</div>' +
        '<div class="habit-name">' + escapeHtml(h.name) + '</div></div>';
    }).join("") : '<div class="empty-state">No habits were active on this day.</div>';

    var html =
      '<div class="modal-close-row"><button id="mClose">✕</button></div>' +
      '<div class="modal-title">' + fmtLong(dateStr) + '</div>' +
      '<div class="modal-sub">' + (isPast ? "Tap to update this day's log." : "This day hasn't happened yet.") + '</div>' +
      '<div id="dModalHabits">' + habitsHtml + '</div>' +
      '<div class="note-box"><label>Notes</label><textarea id="dModalNote" ' + (isPast?'':'disabled') + '>' + escapeHtml(log.note||"") + '</textarea></div>';

    openModal(html);
    document.getElementById("mClose").addEventListener("click", closeModal);

    if(isPast){
      document.querySelectorAll("#dModalHabits .habit-item").forEach(function(el){
        el.addEventListener("click", function(){
          var l = getLog(dateStr, true);
          var hid = el.getAttribute("data-habit");
          l.done[hid] = !l.done[hid];
          saveState();
          el.classList.toggle("done");
          el.querySelector(".habit-check").textContent = l.done[hid] ? "✓" : "";
          renderCalendar(); renderStats(); renderToday();
        });
      });
      var noteEl = document.getElementById("dModalNote");
      noteEl.addEventListener("input", function(){
        var l = getLog(dateStr, true);
        l.note = noteEl.value;
        saveState();
      });
    }
  }

  /* ---------------- data management ---------------- */

  function exportData(){
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "winter-arc-backup-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed.settings || !parsed.habits || !parsed.logs) throw new Error("bad shape");
        if(!confirm("Import this backup? It will replace your current data.")) return;
        state = parsed;
        saveState();
        renderAll();
      }catch(e){
        alert("That file doesn't look like a valid Winter Arc backup.");
      }
    };
    reader.readAsText(file);
  }

  function resetAll(){
    if(!confirm("Reset everything? This clears all habits and logs on this device and can't be undone.")) return;
    if(!confirm("Really reset? Consider exporting a backup first.")) return;
    state = defaultState();
    saveState();
    renderAll();
  }

  /* ---------------- wire up static UI ---------------- */

  document.querySelectorAll(".bottomnav button").forEach(function(b){
    b.addEventListener("click", function(){ switchView(b.getAttribute("data-view")); });
  });

  document.getElementById("addHabitBtn").addEventListener("click", function(){ openHabitModal(null); });

  document.getElementById("saveDatesBtn").addEventListener("click", function(){
    var start = document.getElementById("startDateInput").value;
    var end = document.getElementById("endDateInput").value;
    if(!start || !end || start >= end){
      alert("Pick a start date that's before the end date.");
      return;
    }
    state.settings.startDate = start;
    state.settings.endDate = end;
    saveState();
    renderAll();
  });

  document.getElementById("exportBtn").addEventListener("click", exportData);
  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function(e){
    if(e.target.files && e.target.files[0]) importData(e.target.files[0]);
    e.target.value = "";
  });
  document.getElementById("resetBtn").addEventListener("click", resetAll);

  renderAll();
})();
</script>
</body>
</html>
